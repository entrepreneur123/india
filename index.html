<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LottoDost Dear Results</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Dear lottery results today: Nagaland State Lottery 1 PM and 8 PM, Sikkim 6 PM, with a ticket checker. Not an official site.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Mukta:wght@400;600;700&family=Mukta+Mahee:wght@400;600;700&family=Roboto+Mono:wght@700&display=swap">
<style>
/* Layout: one narrow column like the app, result cards first, checker second, safety last. Colors are the app's theme. */
:root {
  --bg: #fff8f4; --fg: #231918; --muted: #6b5552; --card: #fdeeeb; --line: #e9cfca;
  --red: #b3261e; --red-ink: #ffffff; --maroon: #410001; --gold: #f2b705; --gold-ink: #261a00;
  --win: #1b7f3b; --win-bg: #d8f5dd;
  --f-body: "Mukta", "Hind Siliguri", "Mukta Mahee", system-ui, "Noto Sans", sans-serif;
  --f-num: "Roboto Mono", ui-monospace, "Noto Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #201a19; --fg: #f1dfdc; --muted: #c9b2ae; --card: #2d2422; --line: #4a3936;
  --red: #ffb4a9; --red-ink: #690002; --maroon: #ffdad5; --gold: #f2b705; --gold-ink: #261a00;
  --win: #9bd5a5; --win-bg: #12391c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #201a19; --fg: #f1dfdc; --muted: #c9b2ae; --card: #2d2422; --line: #4a3936;
  --red: #ffb4a9; --red-ink: #690002; --maroon: #ffdad5; --gold: #f2b705; --gold-ink: #261a00;
  --win: #9bd5a5; --win-bg: #12391c; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 34rem; margin: 0 auto; padding-block: 16px 40px; display: grid; gap: 14px }
h1 { font-size: 1.6rem; margin: 0; line-height: 1.2 }
h2 { font-size: 1.15rem; margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 0 }
.langs, .dates { display: flex; gap: 8px; flex-wrap: wrap }
.chip { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 999px;
  padding: 6px 14px; font: inherit; font-size: .95rem; cursor: pointer; min-height: 40px }
.chip[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 700 }
.chip:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--red); outline-offset: 2px }
.banner { background: var(--card); border-radius: 14px; padding: 10px 14px }
.banner.hot { background: var(--gold); color: var(--gold-ink); font-weight: 600 }
.cards { display: grid; gap: 12px }
.card { background: var(--card); border-radius: 18px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0 }
.head { display: flex; gap: 12px; align-items: center }
.time { background: var(--red); color: var(--red-ink); border-radius: 12px; padding: 6px 10px; text-align: center; flex: none; min-width: 5.2rem }
.time b { display: block; font-size: 1.05rem; line-height: 1.2 }
.time span { font-size: .8rem }
.name { min-width: 0 }
.name strong { display: block; overflow-wrap: anywhere }
.name small { color: var(--muted) }
.verified { margin-left: auto; flex: none; border: 1px solid var(--win); color: var(--win); border-radius: 999px; padding: 2px 10px; font-size: .8rem; font-weight: 600 }
.label { color: var(--muted); font-size: .9rem; margin-top: 4px }
.first { font: 700 clamp(2rem, 9vw, 2.6rem)/1.1 var(--f-num); color: var(--red); letter-spacing: .02em; font-variant-numeric: tabular-nums }
details summary { cursor: pointer; color: var(--muted); font-size: .9rem; padding-block: 4px }
.tier { border-top: 1px solid var(--line); padding-block: 8px; display: grid; gap: 4px }
.tier-h { display: flex; justify-content: space-between; gap: 8px; font-weight: 700 }
.tier-h span:last-child { color: var(--red); white-space: nowrap }
.hint { color: var(--muted); font-size: .85rem }
.nums { display: flex; flex-wrap: wrap; gap: 4px 10px; font: 700 1rem/1.5 var(--f-num); font-variant-numeric: tabular-nums }
.nums mark { background: var(--gold); color: var(--gold-ink); border-radius: 4px; padding: 0 2px }
a { color: var(--red) }
.check { display: grid; gap: 10px; background: var(--card); border-radius: 18px; padding: 14px 16px }
.row { display: flex; gap: 8px; flex-wrap: wrap }
.row input { flex: 1 1 12rem; min-width: 0; font: 700 1.2rem var(--f-num); padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); text-transform: uppercase }
.row button { font: inherit; font-weight: 700; padding: 10px 22px; border-radius: 999px; border: 0; background: var(--red); color: var(--red-ink); cursor: pointer; min-height: 44px }
.res { display: grid; gap: 8px }
.res > div { border-radius: 12px; padding: 10px 12px; background: var(--bg) }
.res .won { background: var(--win-bg); color: var(--fg) }
.res .won strong { color: var(--win) }
.err { color: var(--red) }
footer { color: var(--muted); font-size: .85rem; display: grid; gap: 8px }
footer h2 { font-size: 1rem; color: var(--fg) }
@media (prefers-reduced-motion: no-preference) { .card { transition: background .2s } }
</style>
</head>
<body>
<main>
  <header style="display:grid;gap:6px">
    <h1>LottoDost</h1>
    <p class="sub" id="subtitle"></p>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
  </header>
  <div id="notice" class="banner" hidden></div>
  <div id="upcoming" class="banner hot" hidden></div>
  <div class="dates" id="dates" role="group" aria-label="Date"></div>
  <section class="cards" id="cards" aria-live="polite"></section>
  <section class="check">
    <h2 id="checkTitle"></h2>
    <p class="hint" id="checkHint" style="margin:0"></p>
    <form class="row" id="checkForm" novalidate>
      <input id="ticket" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="39C 06366">
      <button id="checkBtn" type="submit"></button>
    </form>
    <div class="res" id="checkRes" aria-live="polite"></div>
  </section>
  <footer>
    <h2 id="safetyTitle"></h2>
    <p id="safetyBody" style="margin:0"></p>
    <p id="disclaimer" style="margin:0"></p>
    <p id="source" style="margin:0"></p>
    <p style="margin:0"><a id="privacy" href="https://entrepreneur123.github.io/india/privacy.html" target="_blank" rel="noopener"></a></p>
  </footer>
</main>

  for (const [code, label] of LANGS) {
    if (!I18N[code]) continue;
    const b = el("button", "chip", label); b.type = "button"; b.lang = code; b.setAttribute("aria-pressed", String(code === lang));
    b.onclick = () => { lang = code; try { localStorage.setItem("lang", code); } catch (e) {} render(); };
    langs.append(b);
  }
}

function card(d) {
  const c = el("article", "card");
  const head = el("div", "head");
  const time = el("div", "time"); time.append(el("b", null, fmtTime(d.time)));
  const tag = (WEEKLY.find(w => w[0] === d.slot) || [])[3];
  if (tag) time.append(el("span", null, t(tag))); else if (d.special) time.append(el("span", null, t("special_tag")));
  const name = el("div", "name"); name.append(el("strong", null, cleanName(d.name)));
  if (d.state) name.append(el("small", null, t("state_lottery", stateName(d.state))));
  head.append(time, name);
  if (d.verified) { const v = el("span", "verified", "✓ " + t("verified")); v.title = t("verified_long"); head.append(v); }
  c.append(head);
  const official = (d.sources || []).find(s => s.kind === "official");
  const sheet = (d.sources || []).find(s => s.kind === "lotterysambad");
  if (d.tiers && d.tiers.length) {
    c.append(el("div", "label", t("first_prize") + " · " + rupees(d.tiers[0].prize)));
    c.append(el("div", "first", d.tiers[0].numbers[0]));
    const det = el("details"); det.append(el("summary", null, t("tap_full_result")));
    for (const tier of d.tiers) {
      const box = el("div", "tier"); const h = el("div", "tier-h");
      h.append(el("span", null, tierTitle(tier.rank)), el("span", null, rupees(tier.prize))); box.append(h);
      const hint = matchHint(tier.match); if (hint) box.append(el("div", "hint", hint));
      const nums = el("div", "nums");
      for (const x of tier.numbers) {
        const xd = x.replace(/^\S+ /, ""); // "37K 90889" -> "90889": highlight by the digits a tier compares
        const hit = query.length >= xd.length && query.slice(-xd.length) === xd;
        nums.append(el(hit ? "mark" : "span", null, x));
      }
      box.append(nums); det.append(box);
    }
    if (query) det.open = true;
    c.append(det);
  } else {
    c.append(el("div", "label", t("pdf_only")));
  }
  const links = el("div", "row");
  if (official) { const a = el("a", null, t("open_official_pdf")); a.href = official.url; a.target = "_blank"; a.rel = "noopener"; links.append(a); }
  if (sheet) { const a = el("a", null, t("open_sheet")); a.href = sambadUrl(sheet.url, d.date); a.target = "_blank"; a.rel = "noopener"; links.append(a); }
  if (links.childElementCount) c.append(links);
  return c;
}

function placeholder(w, date) {
  const [slot, time, state, tag] = w;
  const c = el("article", "card"); const head = el("div", "head");
  const tb = el("div", "time"); tb.append(el("b", null, fmtTime(time)), el("span", null, t(tag)));
  const name = el("div", "name"); name.append(el("strong", null, "—"), el("small", null, t("state_lottery", stateName(state))));
  head.append(tb, name); c.append(head);
  const now = istNow(), mins = (+time.slice(0, 2)) * 60 + (+time.slice(3)) - (now.getUTCHours() * 60 + now.getUTCMinutes());
  let msg = t("no_result");
  if (date === istToday()) msg = mins > 0 ? t("draw_in", Math.floor(mins / 60), mins % 60) : (mins > -90 ? t("result_coming") : t("no_result"));
  c.append(el("div", "label", msg));
  return c;
}

function render() {
  renderStatic();
  const notice = $("notice"), cards = $("cards"), dates = $("dates");
  if (!today) { notice.hidden = false; notice.textContent = t("offline_banner"); cards.replaceChildren(); dates.replaceChildren(); return; }
  notice.hidden = true; // an embedded snapshot still shows its own dates on the chips below
  const up = ((index && index.upcoming) || []).find(u => u.date >= istToday());
  $("upcoming").hidden = !up; if (up) $("upcoming").textContent = t("upcoming_special", up.name, fmtDate(up.date));
  const all = [...new Set(today.draws.map(d => d.date))].sort().reverse();
  if (!all.includes(istToday()) && istToday() > (all[0] || "")) all.unshift(istToday());
  if (!selected || !all.includes(selected)) selected = all[0];
  dates.replaceChildren();
  for (const d of all) {
    const b = el("button", "chip", d === istToday() ? t("today") : fmtDate(d)); b.type = "button";
    b.setAttribute("aria-pressed", String(d === selected)); b.onclick = () => { selected = d; render(); }; dates.append(b);
  }
  cards.replaceChildren();
  if (index && (index.noDraw || []).includes(selected)) { cards.append(el("div", "banner", t("no_draw_day"))); return; }
  const day = today.draws.filter(d => d.date === selected)
    .sort((a, b) => a.time.localeCompare(b.time) || (ORDER[a.slot] ?? 9) - (ORDER[b.slot] ?? 9));
  for (const w of WEEKLY) if (!day.some(d => d.slot === w[0])) day.push({ __ph: w });
  day.sort((a, b) => (a.time || a.__ph[1]).localeCompare(b.time || b.__ph[1]));
  for (const d of day) cards.append(d.__ph ? placeholder(d.__ph, selected) : card(d));
}

function runCheck(ev) {
  if (ev) ev.preventDefault();
  const out = $("checkRes"); out.replaceChildren();
  if (!$("ticket").value.trim()) { query = ""; render(); return; }
  const tk = parseTicket($("ticket").value);
  if (!tk) { query = ""; out.append(el("div", "err", t("ticket_invalid"))); render(); return; }
  query = tk.digits; render();
  if (!today) return;
  const checks = today.draws.map(d => check(tk, d)).filter(Boolean)
    .sort((a, b) => ((b.wins[0] || {}).tier?.prize ?? -1) - ((a.wins[0] || {}).tier?.prize ?? -1) || (b.d.date + b.d.time).localeCompare(a.d.date + a.d.time));
  const won = checks.filter(c => c.wins.length);
  for (const c of won) {
    const w = c.wins[0], box = el("div", "won");
    box.append(el("strong", null, (w.needsFull ? t("maybe_first") : t("you_won")) + " 🎉"));
    box.append(el("div", null, tierTitle(w.tier.rank) + " · " + rupees(w.tier.prize)));
    box.append(el("div", "hint", cleanName(c.d.name) + " · " + fmtDate(c.d.date) + " " + fmtTime(c.d.time)));
    if (w.needsFull) box.append(el("div", "hint", t("need_full_number")));
    if (c.wins.length > 1) box.append(el("div", "hint", t("also_matches", c.wins.slice(1).map(x => tierTitle(x.tier.rank)).join(", "))));
    out.append(box);
  }
  if (!won.length) {
    const box = el("div"); box.append(el("strong", null, t("no_win_title", display(tk))));
    box.append(el("div", "hint", t("no_win_body", checks.length))); out.append(box);
  } else if (tk.fmt === "DIGITS" && tk.digits.length < 5) {
    out.append(el("div", "hint", t("need_full_number")));
  }
}

async function boot() {
  lang = pickLang(); render();
  $("checkForm").addEventListener("submit", runCheck);
  const [tj, ij] = await Promise.all([getJson("today.json"), getJson("index.json")]);
  if (tj) { today = tj; index = ij; }
  else if (SNAPSHOT) { today = Object.assign({ __snapshot: true }, SNAPSHOT.today); index = SNAPSHOT.index; }
  render();
}
boot();
</script>
</body>
