<!DOCTYPE html>
<html lang="en">
<head>
    <title>APPSC</title>
    <link rel="icon" href="images/logonew.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/custom_bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }


        .extension-notice {
            color: #df1111 !important;
            font-weight: bold !important;
            font-size: 18px !important;
            line-height: 1.6;
            text-align: left;
            padding: 10px 0;
            width: 100%;
        }

            .extension-notice span {
                color: inherit !important;
                font-weight: inherit !important;
            }

            .extension-notice .notice-icon {
                display: inline;
                margin-right: 5px;
            }

        /* Responsive styling */
        @media (max-width: 767px) {
            .extension-notice {
                font-size: 15px !important;
                line-height: 1.5;
                padding: 10px 15px;
                text-align: left;
            }
        }
    </style>

</head>
<body>

    <!--<body style="background-image: url('/images/bg_landing.png');">-->

    <div class="header-part">

                        <a href="https://portal-psc.ap.gov.in/Default.aspx">

                                <img src="images/website.png">
                                <h4>APPSC Website</h4>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-3 mb-4">
                        <a href="https://otpr-psc.ap.gov.in/">

                                <h4>OTPR Registration</h4>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-3 mb-4">
                        <a href="https://psc.ap.gov.in/OnlineApplication/LandingPage_Application.aspx">
                            <div class="sub-box">
                                <img src="images/application.png">
                                <h4>Online Application Submission</h4>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-3 mb-4">
                        <a href="https://portal-psc.ap.gov.in/Download_HallTickets">
                            <div class="sub-box">
                                <img src="images/hallticket.png">
                                <h4>Download Hallticket</h4>
                            </div>
                        </a>
                    </div>
                </div>

                <!--<div class="row">
                    <div class="col-xs-12">

    </div>



    <div class="footer-part">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p>Designed & Developed by <img src="images/aponline-logo.png"></p>
                </div>
                <div class="col-md-6">
                    <p class="right-side">Site Maintained By Information Systems Wing APPSC</p>
                </div>
            </div>
        </div>
    </div>
