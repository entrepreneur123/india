# Reads our Google Search Console numbers once a day and keeps them on the `seo` branch
# (gsc/latest.md first), so the site can be tuned to what people in India really search.
# Needs the GSC_SERVICE_ACCOUNT_JSON secret (a service account added to the Search Console
# property as a user); without it the run only says so.
name: gsc

on:
  schedule:
    - cron: "23 3 * * *"   # 08:53 IST; Search Console data lags 1-3 days anyway
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gsc
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - name: Key present?
        id: key
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "GSC_SERVICE_ACCOUNT_JSON is not set: add it under Settings > Secrets and variables > Actions" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - name: Read Search Console
        if: steps.key.outputs.ok == 'true'
        working-directory: pipeline
        run: |
          pip install -q google-auth==2.61.0 requests==2.33.1
          if git fetch -q origin seo; then
            git worktree add -q ../seo FETCH_HEAD
          else   # first run: the branch holds only the reports
            git worktree add -q --detach ../seo
            git -C ../seo checkout -q --orphan seo
            git -C ../seo rm -rfq .
          fi
          python -m lottery_pipeline.gsc --site sc-domain:lottodost.com --out ../seo/gsc
          cat ../seo/gsc/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        if: steps.key.outputs.ok == 'true'
        working-directory: seo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gsc
          git diff --cached --quiet && exit 0
          git commit -qm "Search Console $(date -u +%F)"
          git push -q origin HEAD:seo
