# Reads our Google Search Console numbers once a day and keeps them on the `seo` branch
# (gsc/latest.md first), so the site can be tuned to what people in India really search.
# Signs in without a key (Workload Identity Federation; the organisation forbids service-account
# keys): the repository variables GSC_WIF_PROVIDER and GSC_SERVICE_ACCOUNT name the pool provider
# and the service account added to the Search Console property. Without them the run only says so.
name: gsc

on:
  schedule:
    - cron: "23 3 * * *"   # 08:53 IST; Search Console data lags 1-3 days anyway
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # the GitHub token Google trusts instead of a key

concurrency:
  group: gsc
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up?
        id: key
        env:
          PROVIDER: ${{ vars.GSC_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.GSC_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$ACCOUNT" ]; then
            echo "GSC_WIF_PROVIDER / GSC_SERVICE_ACCOUNT are not set (Settings > Secrets and variables > Actions > Variables)" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: google-github-actions/auth@v3
        id: auth
        if: steps.key.outputs.ok == 'true'
        with:
          workload_identity_provider: ${{ vars.GSC_WIF_PROVIDER }}
          service_account: ${{ vars.GSC_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - name: Read Search Console
        if: steps.key.outputs.ok == 'true'
        working-directory: pipeline
        env:
          GSC_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          pip install -q google-auth==2.61.0 requests==2.33.1
          if git fetch -q origin seo; then
            git worktree add -q ../seo FETCH_HEAD
          else   # first run: the branch holds only the reports
            git worktree add -q --detach ../seo
            git -C ../seo checkout -q --orphan seo
            git -C ../seo rm -rfq .
          fi
          python -m lottery_pipeline.gsc --site sc-domain:lottodost.com --out ../seo/gsc
          cat ../seo/gsc/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        if: steps.key.outputs.ok == 'true'
        working-directory: seo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gsc
          git diff --cached --quiet && exit 0
          git commit -qm "Search Console $(date -u +%F)"
          git push -q origin HEAD:seo
