name: ci

on:
  push:
    branches-ignore: [data]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pytest
      - working-directory: pipeline
        run: python -m pytest -q tests
      - name: Load model runs
        run: pip install -q numpy && python loadsim/simulate.py
      - name: Website generator (pages, languages, sitemap, ads)
        run: python -m pytest -q web/test_site.py

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Translations complete, placeholders intact
        working-directory: android
        run: python3 tools/check_translations.py
      - name: Unit + screenshot tests, lint, release build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest -Proborazzi.test.record=true lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-outputs
          path: |
            android/app/build/outputs/roborazzi/
            android/app/build/outputs/apk/release/
            android/app/build/reports/

  chat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Yaari chat prototype - unit + UI flow tests, lint, release build
        working-directory: chat
        run: ./gradlew --no-daemon testDemoDebugUnitTest testLiveDebugUnitTest -Proborazzi.test.record=true lintDemoRelease lintLiveRelease assembleDemoRelease bundleLiveRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-outputs
          path: |
            chat/app/build/outputs/roborazzi/
            chat/app/build/outputs/apk/
            chat/app/build/outputs/bundle/
            chat/app/build/reports/

  chat-web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: chat/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: chat/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Yaari web - typecheck, unit tests, static build (demo backend)
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm test
          pnpm build
