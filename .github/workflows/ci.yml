name: ci

on:
  push:
    branches-ignore: [data]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pytest
      - working-directory: pipeline
        run: python -m pytest -q tests
      - name: Load model runs
        run: pip install -q numpy && python loadsim/simulate.py
      - name: Website generator (pages, languages, sitemap, ads)
        run: python -m pytest -q web/test_site.py

  jobs-alerts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pytest
      - name: SSC pipeline, classifier and eligibility rules (fixtures from ssc.gov.in)
        working-directory: jobs/pipeline
        run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Website eligibility port gives the same answers as the pipeline
        working-directory: jobs/web
        run: node --test eligibility.test.mjs tools.test.mjs

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Translations complete, placeholders intact
        working-directory: android
        run: python3 tools/check_translations.py
      - name: Unit + screenshot tests, lint, release build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest -Proborazzi.test.record=true lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-outputs
          path: |
            android/app/build/outputs/roborazzi/
            android/app/build/outputs/apk/release/
            android/app/build/reports/
