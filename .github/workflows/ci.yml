name: ci

on:
  push:
    branches-ignore: [data]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pytest
      - working-directory: pipeline
        run: python -m pytest -q tests

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + screenshot tests, lint, release build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest -Proborazzi.test.record=true lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-outputs
          path: |
            android/app/build/outputs/roborazzi/
            android/app/build/outputs/apk/release/
            android/app/build/reports/
