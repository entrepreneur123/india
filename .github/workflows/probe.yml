# Manual check: which result sources answer from GitHub's runners (outside India).
name: probe-sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch each source once
        run: |
          for u in \
            https://statelottery.kerala.gov.in/ \
            https://statelottery.kerala.gov.in/index.php/lottery-result-view \
            https://www.punjabstatelotteries.gov.in/ \
            https://finance.wb.gov.in/new_fin/Pages/Dir_State_Lotteries.aspx \
            https://statelotteries.goa.gov.in/ \
            https://lottery.maharashtra.gov.in/mhlotteryresults.aspx \
            https://www.sikkimlotteries.com/ \
            https://www.nagalandlotteries.com/results.php \
            https://www.lotterysambad.com/ \
            https://keralalotteries.net/ \
            https://www.keralalotteryresult.net/ ; do
            printf '%s ' "$u"
            curl -s -o /dev/null -m 25 -A "Mozilla/5.0 (Linux; Android 14)" -w '%{http_code} %{content_type} %{size_download}B %{time_total}s %{remote_ip}\n' "$u" || echo "FAILED ($?)"
          done
