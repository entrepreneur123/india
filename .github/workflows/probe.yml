# Temporary: checks which result sources answer from GitHub's runners. Deleted after one run.
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for u in https://lottery.maharashtra.gov.in/mhlotteryresults.aspx \
                   "https://lottery.maharashtra.gov.in/UploadFiles/1025202617244962025_10_2026%20N_94%20Mah_%20Gajlaxmi%20Ravi%20Weekly%20Draw%20Result.pdf" \
                   https://www.punjabstatelotteries.gov.in/ http://www.punjabstatelotteries.gov.in/ \
                   "https://www.goodreturns.in/punjab-weekly-lottery-results.html?id=1393" \
                   https://statelotteries.goa.gov.in/ ; do
            for i in 1 2 3; do
              r=$(curl -sS -A "$UA" -o /tmp/o -m 40 -w "%{http_code} %{size_download} %{content_type}" "$u" 2>&1) && break; sleep 5
            done
            echo "PROBE $r | $u"
          done
