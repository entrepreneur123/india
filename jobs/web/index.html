<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSC Job Alerts</title>
<meta name="description" content="Latest SSC notices, results, admit cards and answer keys from ssc.gov.in, exam dates, fees and an age and education eligibility check. Not a government website.">
<meta name="theme-color" content="#1d4ed8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #111827; --muted: #4b5563; --line: #e5e7eb;
  --brand: #1d4ed8; --brand-ink: #ffffff; --chip: #eef2ff;
  --ok: #047857; --ok-bg: #ecfdf5; --warn: #92400e; --warn-bg: #fffbeb; --bad: #b91c1c; --bad-bg: #fef2f2;
  --focus: #f59e0b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1220; --card: #111a2e; --text: #e5e7eb; --muted: #9ca3af; --line: #1f2a44;
    --brand: #60a5fa; --brand-ink: #0b1220; --chip: #1e293b;
    --ok: #34d399; --ok-bg: #052e22; --warn: #fbbf24; --warn-bg: #2d2006; --bad: #f87171; --bad-bg: #2c0b0b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif;
}
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
header { background: var(--brand); color: var(--brand-ink); padding: 14px 16px 0; }
.top { display: flex; justify-content: space-between; gap: 8px; align-items: start; max-width: 760px; margin: 0 auto; }
header h1 { margin: 0; font-size: 1.15rem; }
header p { margin: 2px 0 10px; font-size: .85rem; opacity: .9; }
#lang {
  flex: none; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid currentColor;
  background: transparent; color: inherit; font: inherit; font-weight: 600; cursor: pointer;
}
nav { display: flex; gap: 2px; overflow-x: auto; max-width: 760px; margin: 0 auto; scrollbar-width: none; }
nav a {
  flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 6px;
  border-radius: 10px 10px 0 0; color: inherit; font-size: .9rem; font-weight: 600; text-decoration: none; opacity: .85; white-space: nowrap;
}
nav a[aria-selected="true"] { background: var(--bg); color: var(--text); opacity: 1; }
main { max-width: 760px; margin: 0 auto; padding: 12px 16px 32px; }
h2 { font-size: 1.15rem; margin: 20px 0 6px; }
h3 { font-size: 1rem; }
.disclaimer, .offline { font-size: .8rem; color: var(--muted); margin: 0 0 8px; }
.offline { color: var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 8px 12px; font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; align-items: center; }
.scroll-row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -16px; padding-right: 16px; }
.scroll-row .chip { flex: none; }
details.filter-box > summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; font-weight: 600; color: var(--brand); }
footer { max-width: 760px; margin: 0 auto; padding: 0 16px 32px; font-size: .8rem; color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font: inherit; font-size: .9rem; cursor: pointer; text-decoration: none;
}
.chip.small { min-height: 32px; font-size: .85rem; }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
select, input[type="date"], input[type="search"], input[type="file"] {
  min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font: inherit; max-width: 100%;
}
input[type="search"] { width: 100%; }
input[type="file"] { padding: 8px; width: 100%; }
label.check { display: flex; gap: 8px; align-items: center; min-height: 44px; }
label.check input { flex: none; width: 20px; height: 20px; margin: 0; }
ul.list { list-style: none; margin: 0; padding: 0; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .8rem; color: var(--muted); }
.badge { padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--text); font-weight: 600; text-decoration: none; }
.badge.recruitment { background: var(--ok-bg); color: var(--ok); }
.badge.amendment { background: var(--warn-bg); color: var(--warn); }
.badge.new { background: var(--bad); color: #fff; }
.item h3 { margin: 6px 0; font-weight: 600; overflow-wrap: anywhere; }
.files, .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; align-items: center; }
.files a {
  display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--line); text-decoration: none; font-size: .9rem; overflow-wrap: anywhere;
}
.empty, .error { text-align: center; color: var(--muted); padding: 32px 8px; }
.error { color: var(--bad); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.card h3 { margin-top: 0; }
.card ul { margin: 6px 0; padding-left: 18px; }
.scroll { overflow-x: auto; }
.grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
.field > label:not(.check) { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
.field select, .field input[type="date"] { width: 100%; }
.primary, .link-button {
  display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border: 0; border-radius: 12px;
  background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 700; cursor: pointer; text-decoration: none;
}
form .primary { width: 100%; margin-top: 12px; }
.banner { border-radius: 12px; padding: 10px 14px; margin: 10px 0; font-weight: 600; }
.small-banner { padding: 6px 10px; font-size: .85rem; }
.banner.open { background: var(--ok-bg); color: var(--ok); }
.banner.closed { background: var(--bad-bg); color: var(--bad); }
.banner.upcoming { background: var(--warn-bg); color: var(--warn); }
.summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.summary span { flex: 1 1 30%; text-align: center; border-radius: 12px; padding: 8px; font-weight: 700; }
.s-eligible { background: var(--ok-bg); color: var(--ok); }
.s-check { background: var(--warn-bg); color: var(--warn); }
.s-ineligible { background: var(--bad-bg); color: var(--bad); }
.post { border-left: 4px solid var(--line); }
.post.check { border-left-color: var(--warn); }
.post ul { margin: 6px 0 0; padding-left: 18px; font-size: .9rem; }
details.group { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
details.group > summary { min-height: 48px; display: flex; align-items: center; padding: 0 14px; font-weight: 700; cursor: pointer; }
details.group.eligible > summary { color: var(--ok); }
details.group.check > summary { color: var(--warn); }
details.group.ineligible > summary { color: var(--bad); }
details.group > .list { padding: 0 10px 2px; }
ul.rows { list-style: none; margin: 0; padding: 0 14px 6px; }
ul.rows li { padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.small { font-size: .85rem; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
caption { text-align: left; font-weight: 700; padding-bottom: 6px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); }
img.sig { display: block; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; background: #fff; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1 id="app-name">SSC Job Alerts</h1><p id="tagline"></p></div>
    <button id="lang" type="button">हिन्दी</button>
  </div>
  <nav id="tabs" role="tablist" aria-label="Sections"></nav>
</header>
<main>
  <p class="offline" id="offline" role="status" hidden></p>
  <p class="disclaimer" id="disclaimer"></p>
  <div id="view"><p class="empty">…</p></div>
</main>
<footer><p id="footer-disclaimer"></p></footer>
<noscript><p style="padding:16px">This site needs JavaScript. Official notices: <a href="https://ssc.gov.in">ssc.gov.in</a></p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
