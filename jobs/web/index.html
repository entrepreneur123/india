<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSC Job Alerts</title>
<meta name="description" content="Latest SSC notices, results by roll number, exam dates, fees, age limits, salary and an eligibility check for every post. UP Police notices too. Unofficial; sources: ssc.gov.in, uppbpb.gov.in.">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
  // Before first paint, so a saved dark theme never flashes white.
  try { const th = JSON.parse(localStorage.getItem('theme')); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch {}
</script>
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --text: #111827; --muted: #5b6474; --line: #e4e7ec;
  --brand: #1d4ed8; --brand-ink: #ffffff; --brand-soft: #eef2ff; --chip: #eef2ff;
  --ok: #047857; --ok-bg: #e9f8f1; --warn: #92400e; --warn-bg: #fff6e0; --bad: #b42318; --bad-bg: #fdecea;
  --focus: #f59e0b; --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220; --card: #121b2f; --text: #e6e9ef; --muted: #9aa4b5; --line: #222d45;
    --brand: #6ea8ff; --brand-ink: #0b1220; --brand-soft: #1a2540; --chip: #1c2741;
    --ok: #3ddc97; --ok-bg: #0d2e22; --warn: #f6c453; --warn-bg: #2e2508; --bad: #ff8a80; --bad-bg: #331313;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220; --card: #121b2f; --text: #e6e9ef; --muted: #9aa4b5; --line: #222d45;
  --brand: #6ea8ff; --brand-ink: #0b1220; --brand-soft: #1a2540; --chip: #1c2741;
  --ok: #3ddc97; --ok-bg: #0d2e22; --warn: #f6c453; --warn-bg: #2e2508; --bad: #ff8a80; --bad-bg: #331313;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
}
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* header */
header { position: sticky; top: 0; z-index: 5; background: #1d4ed8; color: #fff; }
.top { display: flex; align-items: center; gap: 8px; max-width: 760px; margin: 0 auto; padding: 10px 16px; }
.top h1 { flex: 1; margin: 0; font-size: 1.1rem; }
.top h1 a { color: inherit; text-decoration: none; }
.icon-btn svg { width: 20px; height: 20px; display: block; }
.icon-btn {
  flex: none; min-width: 40px; min-height: 40px; padding: 0 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.55);
  background: transparent; color: inherit; font: inherit; font-weight: 600; cursor: pointer;
}

/* bottom navigation */
nav#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--card); border-top: 1px solid var(--line);
}
nav#tabs a {
  flex: 1; max-width: 152px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--muted); text-decoration: none; font-size: .72rem; font-weight: 600;
}
nav#tabs svg { width: 24px; height: 24px; }
nav#tabs a[aria-current="page"] { color: var(--brand); }
nav#tabs a[aria-current="page"] svg { background: var(--brand-soft); border-radius: 999px; padding: 2px 12px; width: 48px; height: 28px; }

main { max-width: 760px; margin: 0 auto; padding: 12px 16px 24px; }
footer { max-width: 760px; margin: 0 auto; padding: 0 16px 24px; font-size: .78rem; color: var(--muted); }
h2 { font-size: 1.15rem; margin: 22px 0 8px; }
h3 { font-size: 1rem; margin: 18px 0 8px; }
.disclaimer { font-size: .78rem; color: var(--muted); margin: 0 0 10px; }
.offline { color: var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: .85rem; }

/* building blocks */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card h3:first-child, .card h2:first-child { margin-top: 0; }
.card ul, .card ol { margin: 6px 0; padding-left: 20px; }
.card li { margin: 4px 0; }
.scroll { overflow-x: auto; }
.small { font-size: .85rem; color: var(--muted); }
.empty, .error { text-align: center; color: var(--muted); padding: 24px 8px; }
.error { color: var(--bad); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; align-items: center; }
.scroll-row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -16px; padding-right: 16px; }
.scroll-row .chip { flex: none; }
details.filter-box > summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; font-weight: 600; color: var(--brand); }
.chip {
  display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font: inherit; font-size: .88rem; cursor: pointer; text-decoration: none;
}
.chip.small { min-height: 32px; font-size: .82rem; }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
select, input[type="date"], input[type="search"], input[type="file"], input[type="text"], textarea {
  min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font: inherit; max-width: 100%;
}
input[type="search"], .field input[type="text"], textarea { width: 100%; }
.field input[type="text"] { font-size: 1.1rem; letter-spacing: .05em; }
input[type="file"] { padding: 8px; width: 100%; }
textarea { padding: 10px; min-height: 140px; line-height: 1.5; resize: vertical; }
label.check { display: flex; gap: 8px; align-items: center; min-height: 44px; }
label.check input { flex: none; width: 20px; height: 20px; margin: 0; }
.grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
.field > label:not(.check) { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
.field select, .field input[type="date"] { width: 100%; }
.primary, .link-button {
  display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border: 0; border-radius: 12px;
  background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 700; cursor: pointer; text-decoration: none;
}
form .primary { width: 100%; margin-top: 12px; }
.actions, .files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
.files a {
  display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--line); text-decoration: none; font-size: .88rem; overflow-wrap: anywhere;
}

/* lists of notices */
ul.list { list-style: none; margin: 0; padding: 0; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.item h3 { margin: 6px 0; font-weight: 600; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .78rem; color: var(--muted); }
.badge { padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--text); font-weight: 600; text-decoration: none; }
.badge.recruitment { background: var(--ok-bg); color: var(--ok); }
.badge.amendment { background: var(--warn-bg); color: var(--warn); }
.badge.new { background: var(--bad); color: #fff; }

/* dashboard tiles */
.tiles { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 560px) { .tiles { grid-template-columns: 1fr 1fr; } }
.tile { display: block; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
.tile strong { display: block; }
.count { display: inline-block; margin-top: 6px; font-weight: 700; font-size: .85rem; padding: 2px 10px; border-radius: 999px; }
.count.open, .count.now { background: var(--ok-bg); color: var(--ok); }
.count.soon { background: var(--warn-bg); color: var(--warn); }

.banner { border-radius: 12px; padding: 10px 14px; margin: 10px 0; font-weight: 600; }
a.cta { display: block; text-decoration: none; }
.small-banner { padding: 6px 10px; font-size: .85rem; }
.banner.open { background: var(--ok-bg); color: var(--ok); }
.banner.closed { background: var(--bad-bg); color: var(--bad); }
.banner.upcoming { background: var(--warn-bg); color: var(--warn); }
.summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.summary span { flex: 1 1 30%; text-align: center; border-radius: 12px; padding: 8px; font-weight: 700; font-size: .9rem; }
.s-eligible { background: var(--ok-bg); color: var(--ok); }
.s-check { background: var(--warn-bg); color: var(--warn); }
.s-ineligible { background: var(--bad-bg); color: var(--bad); }
.post { border-left: 4px solid var(--line); }
.post.check { border-left-color: var(--warn); }
.post ul { margin: 6px 0 0; padding-left: 18px; font-size: .9rem; }
details.group { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
details.group > summary { min-height: 48px; display: flex; align-items: center; padding: 0 14px; font-weight: 700; cursor: pointer; }
details.group.eligible > summary { color: var(--ok); }
details.group.check > summary { color: var(--warn); }
details.group.ineligible > summary { color: var(--bad); }
details.group > .list, details.group > .inner { padding: 0 14px 10px; }
ul.rows { list-style: none; margin: 0; padding: 0 14px 6px; }
ul.rows li { padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
ul.rows.card { padding: 6px 14px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
caption { text-align: left; font-weight: 700; padding-bottom: 6px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); }
.timeline { list-style: none; margin: 0; padding: 0; }
.stage { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
.stage-state { flex: none; font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--chip); }
.stage.done .stage-state { background: var(--ok-bg); color: var(--ok); }
.stage.now .stage-state, .stage.next .stage-state { background: var(--warn-bg); color: var(--warn); }
.stage.later { opacity: .75; }
.ref { font-size: .75rem; color: var(--muted); }
.typing-text { max-height: 170px; overflow-y: auto; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: .95rem; }
img.sig { display: block; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; background: #fff; }

/* loading and messages */
.skeleton { height: 76px; border-radius: 14px; margin-bottom: 10px; background: linear-gradient(90deg, var(--card) 0%, var(--line) 50%, var(--card) 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .9rem; font-weight: 600; max-width: 90vw;
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><a href="#home" id="app-name">SSC Job Alerts</a></h1>
    <button id="theme" class="icon-btn" type="button" aria-label="Theme"></button>
    <button id="lang" class="icon-btn" type="button">हिन्दी</button>
  </div>
</header>
<main>
  <p class="offline" id="offline" role="status" hidden></p>
  <p class="disclaimer" id="disclaimer"></p>
  <div id="view"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
</main>
<footer><p id="footer-disclaimer"></p></footer>
<nav id="tabs" aria-label="Sections"></nav>
<noscript><p style="padding:16px">This site needs JavaScript. Official notices: <a href="https://ssc.gov.in">ssc.gov.in</a></p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
